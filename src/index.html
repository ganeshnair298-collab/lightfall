<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lightfall</title>
  <link rel="stylesheet" href="index.css">
</head>

<body>

  <canvas id="glassCanvas"></canvas>

  <div class="dynamic-island empty" id="dynamicIsland">

    <div class="island-mini">
    </div>

    <div class="island-popup">

      <div class="island-header">
        <span>● NOW PLAYING</span>
        <span>LIGHTFALL</span>
        <button id="closeSongBtn" type="button" aria-label="Close song" title="Close song" hidden>×</button>
      </div>

      <div class="track-container">
        <div class="album-art" id="albumArt">♫</div>

        <div class="track-details">
          <h2 id="trackTitle">Choose a song</h2>
          <p id="trackArtist">Click album art or press Ctrl+O</p>
          <div class="wave-section">
            <div class="waveform" id="waveform"></div>

            <div class="time-row">
              <span id="currentTime">0:00</span>
              <span id="duration">0:00</span>
            </div>
          </div>
        </div>

        <button id="favoriteBtn">♡</button>
      </div>

      <div class="controls">
        <button id="shuffleBtn">⤨</button>
        <button id="previousBtn">|◀</button>
        <button id="playBtn" class="play-button">▶</button>
        <button id="nextBtn">▶|</button>
        <button id="repeatBtn">⟳</button>
      </div>

      <div class="island-footer">
        <span>YOUR MUSIC. YOUR WORLD.</span>
        <span>LIGHTFALL</span>
      </div>

    </div>
  </div>

  <audio id="audio"></audio>

  <script src="index.js"></script>
</body>

</html>
